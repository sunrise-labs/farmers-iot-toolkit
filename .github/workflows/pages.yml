name: Publish the Toolkit website

# Builds site/dist/ from source and publishes it to GitHub Pages.
#
# The site is built here rather than just uploading the committed dist/, because
# the whole point of rendering every pin table and BOM row from src/data.ts is
# that the published page cannot disagree with the data. Building in CI means a
# forgotten `bun site/build.ts` can't put a stale page in front of a farmer.
#
# This workflow does nothing until Pages is switched on for the repo:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Until then the deploy step fails loudly rather than publishing anything.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push may supersede a queued one, but a deploy
# already in flight is never cancelled half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      # No install step: the site has no dependencies and no package.json.
      - name: Build the site
        run: bun site/build.ts

      # The committed dist/ exists so the site can be served from anywhere with
      # no build step. That only holds if it's kept current, so say so out loud
      # rather than letting it rot silently. A warning, not a failure — what
      # just got built is what gets published either way.
      - name: Check the committed dist/ is current
        run: |
          if [ -n "$(git status --porcelain site/dist)" ]; then
            {
              echo "### :warning: \`site/dist/\` is stale in the repo"
              echo
              echo "The CI build differs from the committed output. The **freshly built**"
              echo "site is what was published; the copy in git is behind. Run"
              echo "\`bun site/build.ts\` and commit \`site/dist/\` to resync."
              echo
              echo '```'
              git status --porcelain site/dist
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":white_check_mark: \`site/dist/\` matches a clean build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
